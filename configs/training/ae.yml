framework: ae
aggregate_output_strategy: all

encoder:
  name: resnet
  enc_channels: [32, 64, 128]
  enc_strides: [2, 2, 2]
head: {name: mirrored}
scorer: {mode: l1, calibration_quantile: 0.99}
loss: {name: reconstruction}

data:
  name: smd
  file: machine-1-1.txt
  window: 512
  stride: 10
  val_fraction: 0.1

train_hyperparameters:
  device: cuda
  epochs: 50
  batch_size: 32
  eval_every: 10
  optimizer: {name: adamw, lr: 0.002, weight_decay: 0.01}
  scheduler: {name: constant}
