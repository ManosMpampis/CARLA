data:
  name: smd
  file: machine-1-1.txt
  window: 512
  stride: 10
  val_fraction: 0.1

train_hyperparameters:
  device: cuda
  epochs: 50
  batch_size: 32
  eval_every: 10
  optimizer: {name: adamw, lr: 0.002, weight_decay: 0.01}
  scheduler: {name: constant}

framework: lewm
experiment_name: guided_forecast

engine:
  name: forecast
  context_ratio: 2
backbone: null
encoder:
  name: resnet
  enc_channels: [32, 64, 128]
  enc_strides: [1, 1, 1]
  output_act: identity
  latent_output: unrestricted
action:
  name: tcn
  hidden_dims: [32, 32, 32]
  dilation: [1, 2, 4]
predictor:
  name: cross_attention
  qk_channels: 16
  value_channels: 32
  num_heads: 4
head: null

aggregate_output_strategy: all
scorer: {mode: l1, calibration_quantile: 0.99, domain: latent}
loss: {name: lewm, loss2_kind: kl, w_pred: 1.0, w_aux: 0.0, w_recon: 0.0, lambda_sigreg: 0.1, lambda_sigreg_tgt: 0.1}
