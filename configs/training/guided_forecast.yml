extends: ae.yml
framework: lewm
experiment_name: guided_forecast

engine:
  name: forecast
  context_ratio: 2
backbone: null
encoder:
  enc_channels: [32, 64, 128]
  enc_strides: [1, 1, 1]
  output_act: identity
  latent_output: unrestricted
action:
  name: tcn
  hidden_dims: [32, 32, 32]
  dilation: [1, 2, 4]
predictor:
  name: cross_attention
  qk_channels: 16
  value_channels: 32
  num_heads: 4
head: null
scorer: {domain: latent}
loss: {name: lewm, loss2_kind: kl, w_pred: 1.0, w_aux: 0.0, w_recon: 0.0, lambda_sigreg: 0.1, lambda_sigreg_tgt: 0.1}
