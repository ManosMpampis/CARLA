# J1 smoke: convolutional-pyramid self-JEPA on one SMD machine (official
# per-machine protocol). Short schedule for acceptance runs.
setup: jepa
stage: score

# Model
backbone: jepa_pyramid
predictor: tcn
horizons: 2
model_kwargs:
  in_channels: 38
  stem_channels: 32
  level_channels: [32, 64, 96]
  kernel_size: 5
  strides: [2, 2, 2]
  dropout: true

anti_collapse: none
criterion: jepa
criterion_kwargs:
  lambda_sigreg: 0.0

# Data — single-machine corpus
train_db_name: smd
val_db_name: smd
fname: machine-1-1.txt
wsz: 256
stride: 5
val_fraction: 0.1


# Scoring is fp32 on the trained weights
seed: 4
device: cuda
amp: false
epochs: 0
batch_size: 64
num_workers: 0
optimizer: adamw
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01
scheduler: constant
scheduler_kwargs:
  lr_eta_min: 0.0

calibration_kwargs:
  quantile: 0.995
probe_kwargs:
  num_probe_windows: 200
  portion: 0.99
eval_window_size: 100

# Weights source (falls back to this run dir's checkpoint if unset)
score_checkpoint: results/smd/smoke_adapt/machine-1-1.txt/jepa/model.pth.tar
