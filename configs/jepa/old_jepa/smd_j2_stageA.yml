setup: jepa
stage: pretrain
backbone: jepa_pyramid
predictor: tcn
horizons: 2
model_kwargs:
  in_channels: 38
  stem_channels: 32
  level_channels:
  - 32
  - 64
  - 96
  kernel_size: 5
  strides:
  - 2
  - 2
  - 2
  dropout: true
anti_collapse: none
criterion: jepa
criterion_kwargs:
  lambda_sigreg: 0.0
train_db_name: smd
val_db_name: smd
fname: machine-1-1.txt
wsz: 256
stride: 10
val_fraction: 0.1
stage_a:
  corpus: single
  masking:
    mode: block
    num_blocks: 4
    block_span: 32
    min_context_tokens: 2
stage_b:
  mode: frozen
seed: 4
device: cuda
amp: false
epochs: 1000
batch_size: 64
num_workers: 0
optimizer: adamw
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01
scheduler: cosine
scheduler_kwargs:
  lr_eta_min: 0.0
calibration_kwargs:
  quantile: 0.995
probe_kwargs:
  num_probe_windows: 200
  portion: 0.99
eval_window_size: 100
