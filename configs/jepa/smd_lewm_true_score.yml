# True-LeWM demo scoring on SMD machine-1-1 (probe-query scoring,
# calibration on clean-train scores only). Weights come from the pretrain
# demo run: results/smd/lewm_true_demo/machine-1-1.txt/jepa/model.pth.tar
setup: jepa
stage: score

# Model — must match the pretrain arm exactly
backbone: jepa_pyramid
model_kwargs:
  in_channels: 38
  stem_channels: 16
  level_channels: [16, 32]
  kernel_size: 5
  strides: [2, 2]
  dropout: false

action_dim: 16
predictor_kwargs:
  nhead: 4
  num_layers: 2

criterion: lewm_true
criterion_kwargs:
  lambda_sigreg: 0.1
  sigreg_kwargs:
    num_slices: 16

# Data — single-machine corpus
train_db_name: smd
val_db_name: smd
fname: machine-1-1.txt
wsz: 128
stride: 5
val_fraction: 0.1

# Scoring is fp32 on the trained weights
seed: 4
device: cuda
amp: false
epochs: 0
batch_size: 64
num_workers: 0
optimizer: adamw
optimizer_kwargs:
  lr: 0.004
  weight_decay: 0.01
scheduler: constant
scheduler_kwargs:
  lr_eta_min: 0.0

calibration_kwargs:
  quantile: 0.995
probe_kwargs:
  num_probe_windows: 200
  portion: 0.99
eval_window_size: 100

# Weights source (falls back to this run dir's checkpoint if unset)
score_checkpoint: results/smd/lewm_true_demo/machine-1-1.txt/jepa/model.pth.tar
