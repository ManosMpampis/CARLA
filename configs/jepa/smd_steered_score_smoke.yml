# Steered-LeWM smoke: score on one SMD machine (official per-machine protocol).
setup: jepa
stage: score

# Model — single-scale ResNet encoder + time aux + frequency predictor
backbone: steered_resnet
model_kwargs:
  in_channels: 38
  enc_channels: [16, 32]
  norm: batch
  dropout: false
aux_kwargs:
  aux_channels: [16, 16, 16]
  kernels: [7, 5, 3]
predictor_kwargs:
  stem_channels: 32
  neck_widths: [32, 32, 32]
  n_fft: 64
  hop_length: 16
  win_length: 64

criterion: steered_lewm
criterion_kwargs:
  loss2_kind: kl
  w_pred: 1.0
  w_aux: 1.0
  lambda_sigreg: 0.1
  lambda_sigreg_tgt: 0.1
  tau: 1.0
  sigreg_kwargs:
    num_slices: 16

# Data — single-machine corpus
train_db_name: smd
val_db_name: smd
fname: machine-1-1.txt
wsz: 128
stride: 5
val_fraction: 0.1


# Scoring is fp32 on the trained weights
seed: 4
device: cuda
amp: false
epochs: 0
batch_size: 32
num_workers: 0
optimizer: adamw
optimizer_kwargs:
  lr: 0.002
  weight_decay: 0.01
scheduler: constant
scheduler_kwargs:
  lr_eta_min: 0.0

calibration_kwargs:
  quantile: 0.995
probe_kwargs:
  num_probe_windows: 200
  portion: 0.99
eval_window_size: 100

# Weights source (falls back to this run dir's checkpoint if unset)
score_checkpoint: results/smd/steered_smoke_adapt/machine-1-1.txt/jepa/model.pth.tar
