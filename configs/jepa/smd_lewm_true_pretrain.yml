# True-LeWM demo: two-stream input masking, one shared PyramidEncoder,
# action-conditioned predictor (mask descriptor via AdaLN scale/shift),
# masked-MSE + SIGReg. Small arm for a fast first run on SMD machine-1-1.
setup: jepa
stage: pretrain

# Model — PyramidEncoder reused as the shared encoder (time modality)
backbone: jepa_pyramid
model_kwargs:
  in_channels: 38
  stem_channels: 16
  level_channels: [16, 32]
  kernel_size: 5
  strides: [2, 2]
  dropout: false

# Predictor — per-level CondPredictor(MaskedReconPredictor) as decoder;
# action is the [mask_ratio, mask_center, mask_span] probe descriptor.
action_dim: 16
predictor_kwargs:
  nhead: 4
  num_layers: 2

criterion: lewm_true
criterion_kwargs:
  lambda_sigreg: 0.1
  sigreg_kwargs:
    num_slices: 16

# Data — single-machine corpus
train_db_name: smd
val_db_name: smd
fname: machine-1-1.txt
wsz: 128
stride: 10
val_fraction: 0.1

stage_a:
  corpus: single
  masking:
    mode: block_input
    num_blocks: 2
    block_span: 32
stage_b:
  mode: frozen

# Training
seed: 4
device: cuda
amp: false
epochs: 200
batch_size: 64
num_workers: 0
optimizer: adamw
optimizer_kwargs:
  lr: 0.004
  weight_decay: 0.01
scheduler: constant
scheduler_kwargs:
  lr_eta_min: 0.0

calibration_kwargs:
  quantile: 0.995
probe_kwargs:
  num_probe_windows: 200
  portion: 0.99
eval_window_size: 100
