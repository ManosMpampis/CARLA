# Setup
setup: pretext

# Model
backbone: resnet_ts
model_kwargs:
  head: mlp
  features_dim: 4
res_kwargs:
  in_channels: 38
  mid_channels: 4

# Dataset
train_db_name: smd
val_db_name: smd
num_classes: 10

# Loss
criterion: pretext
criterion_kwargs:
  temperature: 0.4
  initial_margin: 1.0
  margin_constant: False
  pos_weight: 1
  neg_weight: 1
  min_improvement: 0.0001
  ema_alpha: 0.5
  adjust_factor: 0.1
  orig_margin: True

# Hyperparameters
epochs: 30
optimizer: adam
optimizer_kwargs:
  #nesterov: False
  #momentum: 0.9
  lr: 0.001
  weight_decay: 0.01
# Scheduler
scheduler: cosine
scheduler_kwargs:
  lr_warmup_epochs: 0
  lr_eta_min: 0.000000001
  T_period: 50
  T_mul: 2
  lr_decay_epochs: [10, 20]
  lr_decay_rate: 0.01
batch_size: 650
num_workers: 0

# Transformations
augmentation_strategy: ts
transformation_kwargs:
  noise_sigma: 0.01

anomaly_kwargs:
  portion: 0.99

evaluation_extra_metrics: False