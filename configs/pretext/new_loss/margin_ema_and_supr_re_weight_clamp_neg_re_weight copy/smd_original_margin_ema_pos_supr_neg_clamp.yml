# Setup
setup: pretext

# Model
backbone: resnet_ts
model_kwargs:
  head: mlp
  features_dim: 4
res_kwargs:
  in_channels: 38
  mid_channels: [4, 8, 8]
  kernel_sizes: [8, 5, 3]

# Dataset
train_db_name: smd
val_db_name: smd
wsz: 256 #200
stride: 5
num_classes: 10

# Loss
criterion: pretext
criterion_kwargs:
  temperature: 0.4
  loss_name: euclidean
  device: cuda
  normalize: True
  clamp_neg_loss: True
  crop: False
  crop_size_min: 5
  crop_size_max: 10
  pos_weight: 1
  neg_weight: 1
  initial_margin: 0.3
  max_margin: 5.0
  min_margin: 0.01
  margin_distance: True
  adjust_factor: 0.001
  ema_alpha: 0.3
  min_improvement: 0.00001
  pos_supression: True
  re_weight: False

# Hyperparameters
epochs: 1000
optimizer: adam
optimizer_kwargs:
  #nesterov: False
  #momentum: 0.9
  lr: 0.001
  weight_decay: 0.01
# Scheduler
scheduler: cosine_restart
scheduler_kwargs:
  lr_warmup_epochs: 20
  lr_eta_min: 0.000000001
  T_period: 50
  T_mul: 2
  lr_decay_epochs: [10, 20]
  lr_decay_rate: 0.01
batch_size: 50
num_workers: 0

# Transformations
augmentation_strategy: ts
transformation_kwargs:
  noise_sigma: 0.01

anomaly_kwargs:
  portion: 0.99