# Complete TSB benchmark suite, independent of the selected SMD/PSM experiments.
# Config paths below are relative to this manifest.
common:
  train_db_name: tsb_ad
  val_db_name: tsb_ad
  wsz: 1024
  stride: 10
  val_fraction: 0.2
  seed: 4
  device: cuda
  amp: false
  batch_size: 64
  num_workers: 0
  score_batch_size: 256
  model_kwargs:
    in_channels: 25
  calibration_quantile: 0.995
  calibration_kwargs: {quantile: 0.995}
  eval_every: 0
  stage_c: {mode: frozen}
  epochs: 300
  decision_trace: false

experiments:
  - framework: ae
    experiment_name: default
    runner: ae
    config: ../baselines/ae.yml

  - framework: vae
    experiment_name: default
    runner: vae
    config: ../baselines/vae.yml

  # To add a named variant, copy an entry and change its overrides:
  # - framework: vae
  #   experiment_name: lr_0.1
  #   runner: vae
  #   config: ../baselines/vae.yml
  #   overrides:
  #     optimizer_kwargs: {lr: 0.1}

  - framework: lewm_encoder
    experiment_name: time
    runner: lewm
    config: ../lewm_encoder/time/phase1.yml

  - framework: lewm_encoder
    experiment_name: frequency
    runner: lewm
    config: ../lewm_encoder/frequency/phase1.yml

  - framework: lewm_encoder
    experiment_name: time_aux
    runner: lewm
    config: ../lewm_encoder/time_aux/phase1.yml

  - framework: lewm_encoder
    experiment_name: frequency_aux
    runner: lewm
    config: ../lewm_encoder/frequency_aux/phase1.yml

  - framework: lewm_encoder
    experiment_name: time_aux_no_film
    runner: lewm
    config: ../lewm_encoder/time_aux_no_film/phase1.yml

  - framework: lewm_encoder
    experiment_name: frequency_aux_no_film
    runner: lewm
    config: ../lewm_encoder/frequency_aux_no_film/phase1.yml

  - framework: reconstruction
    experiment_name: default
    runner: recon
    config: ../lewm_encoder/frequency/reconstruction/default.yml
    pretrained_experiment: lewm_encoder/frequency

  - framework: reconstruction
    experiment_name: default
    runner: recon
    config: ../lewm_encoder/frequency_aux/reconstruction/default.yml
    pretrained_experiment: lewm_encoder/frequency_aux

  - framework: reconstruction
    experiment_name: default
    runner: recon
    config: ../lewm_encoder/frequency_aux_no_film/reconstruction/aux_crop.yml
    pretrained_experiment: lewm_encoder/frequency_aux_no_film

  - framework: reconstruction
    experiment_name: auxilary_added
    runner: recon
    config: ../lewm_encoder/frequency_aux/reconstruction/default.yml
    pretrained_experiment: lewm_encoder/frequency_aux
    overrides:
      recon_kwargs: {with_aux: true}
      score_aux_crop: true

  - framework: reconstruction
    experiment_name: auxilary_added
    runner: recon
    config: ../lewm_encoder/frequency_aux_no_film/reconstruction/aux_crop.yml
    pretrained_experiment: lewm_encoder/frequency_aux_no_film
    overrides:
      recon_kwargs: {with_aux: true}
      score_aux_crop: true

  - framework: reconstruction
    experiment_name: default
    runner: recon
    config: ../lewm_encoder/time/reconstruction/default.yml
