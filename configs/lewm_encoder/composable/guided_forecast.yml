extends: ../frequency_aux/phase1.yml
framework: lewm_composable
phase1_experiment: null
experiment_name: guided_forecast
experiment_description: "Latent forecast conditioned on a TCN key from the observed target crop"
tag_jepa: null

lewm_modules:
  engine:
    name: forecast
    context_crop: [0, 320]
    target_crop: [320, 512]
  encoder:
    name: resnet
    in_channels: 38
    enc_channels: [32, 64, 128]
    enc_strides: [2, 2, 2]
    output_act: identity
  action:
    name: tcn
    hidden_dims: [32, 32, 32]
    kernels: 3
    dilation: [1, 2, 4]
  predictor:
    name: cross_attention
    qk_channels: 16
    value_channels: 32
    num_heads: 4
  score_domain: latent

criterion_kwargs:
  loss2_kind: l1
  w_aux: 0.0
