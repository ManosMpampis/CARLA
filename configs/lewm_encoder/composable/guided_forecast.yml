extends: ../frequency_aux/phase1.yml
framework: lewm
phase1_experiment: null
experiment_name: guided_forecast
experiment_description: "Observed-future queries retrieve historical patterns for latent comparison"
tag_jepa: null

lewm_modules:
  engine:
    name: forecast
    context_ratio: 2
  encoder:
    name: resnet
    in_channels: 38
    enc_channels: [32, 64, 128]
    enc_strides: [1, 1, 1]
    output_act: identity
    latent_output: unrestricted
  action:
    name: tcn
    hidden_dims: [32, 32, 32]
    kernels: 3
    dilation: [1, 2, 4]
  predictor:
    name: cross_attention
    qk_channels: 16
    value_channels: 32
    num_heads: 4
  score_domain: latent

criterion_kwargs:
  loss2_kind: kl
  w_aux: 0.0
