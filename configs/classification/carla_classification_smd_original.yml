# setup
setup: classification

# Loss
criterion: classification
criterion_kwargs:
   entropy_weight: 5
   inconsistency_weight: 1
   consistency_weight: 1

# Weight update
update_cluster_head_only: False # Update full network in classification
num_heads: 1 # Only use one head

# Model
backbone: resnet_ts
res_kwargs:
  in_channels: 38
  mid_channels: 4

# Dataset
train_db_name: smd
val_db_name: smd
num_classes: 10
num_neighbors: 5

# Transformations
augmentation_strategy: ts
transformation_kwargs:
   noise_sigma: 0.01

# Hyperparameters
optimizer: adam
optimizer_kwargs:
   lr: 0.01
   weight_decay: 0.001
epochs: 100
batch_size: 650
num_workers: 0

# Scheduler
scheduler: constant
scheduler_kwargs:
  lr_warmup_epochs: 0
  lr_eta_min: 0.000000001
  T_period: 50
  T_mul: 2
  lr_decay_epochs: [10, 20]
  lr_decay_rate: 0.01

anomaly_kwargs:
   portion: 0.99