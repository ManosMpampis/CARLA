# setup
setup: classification

tag_class: no_entropy

# Loss
criterion: classification
criterion_kwargs:
   entropy_weight: 0
   inconsistency_weight: 1
   consistency_weight: 1
   entropy_norm: True


# Weight update
update_cluster_head_only: False # Update full network in classification
num_heads: 1 # Only use one head

# Model
backbone: resnet_ts
res_kwargs:
  in_channels: 25
  mid_channels: [4, 8, 8]
  kernel_sizes: [8, 5, 3]
  norm_layer_name: batch
  window_size: 256

# Dataset
train_db_name: psm
val_db_name: psm
wsz: 256 #200
stride: 5
num_classes: 10
num_neighbors: 5

# Transformations
augmentation_strategy: ts
transformation_kwargs:
   noise_sigma: 0.01

# Hyperparameters
optimizer: adam
optimizer_kwargs:
   lr: 0.01
   weight_decay: 0.001
epochs: 1000
batch_size: 512
num_workers: 0

# Scheduler
scheduler: cosine_restart
scheduler_kwargs:
  lr_warmup_epochs: 20
  lr_eta_min: 0.00001
  T_period: 50
  T_mul: 2
  lr_decay_epochs: [10, 20]
  lr_decay_rate: 0.01

anomaly_kwargs:
   portion: 0.99